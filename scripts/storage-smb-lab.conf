[global]
    server role = standalone server
    workgroup = DOMUSLAB
    netbios name = storage-server
    smb ports = 445
    server min protocol = SMB2_10
    map to guest = Bad User
    guest account = nobody
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    log level = 0
    follow symlinks = no
    wide links = no

[media]
    path = /fixture/payload
    guest ok = yes
    read only = yes

[media-alias]
    path = /fixture/payload
    guest ok = yes
    read only = yes

[staging]
    path = /fixture/payload/staging
    guest ok = yes
    read only = yes

[private-alias]
    path = /fixture/private
    guest ok = yes
    read only = yes
