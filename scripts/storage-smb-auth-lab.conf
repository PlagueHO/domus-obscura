[global]
    server role = standalone server
    workgroup = DOMUSLAB
    netbios name = storage-server
    smb ports = 445
    server min protocol = SMB3_11
    smb encrypt = required
    ntlm auth = ntlmv2-only
    map to guest = Never
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    log level = 0
    follow symlinks = no
    wide links = no

[media]
    path = /fixture/payload
    valid users = domus_a domus_b
    read only = yes

[media-alias]
    path = /fixture/payload
    valid users = domus_a domus_b
    read only = yes

[staging]
    path = /fixture/payload/staging
    valid users = domus_a
    read only = yes

[private-alias]
    path = /fixture/private
    valid users = domus_a
    read only = yes
