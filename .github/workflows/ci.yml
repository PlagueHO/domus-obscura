name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install pinned Rust components
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo task bootstrap
      - run: cargo task check
      - run: cargo task build
      - run: cargo task smoke
      - name: Install pinned NSIS compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --version=3.13 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS installation failed.' }
          'MAKENSIS=C:\Program Files (x86)\NSIS\makensis.exe' >> $env:GITHUB_ENV
      - name: Check Windows packaging helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('services.ps1', 'package-smoke.ps1', 'service-helper-tests.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "packaging\windows\$path"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          powershell.exe -NoProfile -File packaging\windows\service-helper-tests.ps1 -NsisCompiler $env:MAKENSIS
          if ($LASTEXITCODE -ne 0) { throw 'Service helper regressions failed.' }
      - name: Build Windows package and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dev.ps1 installer-windows
      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dev.ps1 package-check

  scale:
    name: Million-record pagination (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: scale-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo task scale
