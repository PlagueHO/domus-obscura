name: Product or architecture decision
description: Resolve a specific open decision before implementation.
title: "Decision: "
labels: ["question"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision needed
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Confirmed requirements and evidence
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
      description: Identify a recommendation without treating it as an approved requirement.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Decision acceptance criteria
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related work
