name: domus-obscura

x-runtime: &runtime
  image: ${DOMUS_IMAGE:-domus-obscura:local}
  platform: linux/amd64
  user: "1000:1000"
  init: true
  read_only: true
  network_mode: host
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 2m
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
  volumes:
    - application:/storage

services:
  api:
    <<: *runtime
    command: [serve, --storage-root, /storage/application]
    environment:
      DOMUS_HEALTH_URL: ${DOMUS_HEALTH_URL:-http://127.0.0.1:8080/}
      DOMUS_HEALTH_CA: ${DOMUS_HEALTH_CA:-}
  worker:
    <<: *runtime
    profiles: [worker]
    command: [worker, /storage/application/config.json]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  application:
